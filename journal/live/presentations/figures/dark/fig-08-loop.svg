<svg fill="#e6e6e6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 268" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e6e6e6"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="-9999" y="-9999" width="99999" height="99999" fill="#1c1c1c"/>

  <!-- 1 : supervised -->
  <text x="100" y="28" font-size="9" text-anchor="middle">1 · supervised epochs</text>

  <text x="46" y="104" font-size="9" text-anchor="middle">VASP data</text>
  <path d="M 82 100 Q 116 84 148 100" fill="none" stroke="#e6e6e6" stroke-width="1" marker-end="url(#a)"/>
  <text x="164" y="104" font-size="9" text-anchor="middle">θ</text>

  <text x="100" y="150" font-size="8" text-anchor="middle" font-style="italic">cuts the search space</text>
  <text x="100" y="162" font-size="8" text-anchor="middle" font-style="italic">down to a region worth</text>
  <text x="100" y="174" font-size="8" text-anchor="middle" font-style="italic">refining</text>

  <line x1="204" y1="18" x2="204" y2="196" stroke="#4a4a4a" stroke-width="0.6"/>

  <!-- 2 : informed -->
  <text x="332" y="28" font-size="9" text-anchor="middle">2 · informed epoch</text>

  <text x="332" y="58" font-size="11" text-anchor="middle">x</text>
  <text x="404" y="102" font-size="11" text-anchor="middle">r , ∇r</text>
  <text x="332" y="150" font-size="11" text-anchor="middle">L</text>
  <text x="256" y="102" font-size="11" text-anchor="middle">θ</text>

  <path d="M 250 90 Q 268 62 318 54" fill="none" stroke="#e6e6e6" stroke-width="1" marker-end="url(#a)"/>
  <text x="268" y="52" font-size="8" text-anchor="middle">operator</text>

  <path d="M 346 54 Q 396 62 400 90" fill="none" stroke="#e6e6e6" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="400" y="52" font-size="8" text-anchor="middle">oracle</text>

  <path d="M 402 112 Q 396 142 348 148" fill="none" stroke="#e6e6e6" stroke-width="1" marker-end="url(#a)"/>
  <text x="404" y="152" font-size="8" text-anchor="middle">aggregate</text>

  <path d="M 316 148 Q 268 142 258 112" fill="none" stroke="#e6e6e6" stroke-width="1" marker-end="url(#a)"/>
  <text x="258" y="152" font-size="8" text-anchor="middle">update</text>

  <text x="332" y="176" font-size="8" text-anchor="middle" font-style="italic">the oracle attaches here, and only here</text>

  <line x1="462" y1="18" x2="462" y2="196" stroke="#4a4a4a" stroke-width="0.6"/>

  <!-- 3 : inference -->
  <text x="540" y="28" font-size="9" text-anchor="middle">3 · inference</text>

  <text x="498" y="104" font-size="9" text-anchor="middle">θ</text>
  <path d="M 510 100 Q 536 84 562 100" fill="none" stroke="#e6e6e6" stroke-width="1" marker-end="url(#a)"/>
  <text x="582" y="104" font-size="9" text-anchor="middle">x</text>

  <ellipse cx="540" cy="146" rx="46" ry="19" fill="none" stroke="#e6e6e6" stroke-width="1.6" stroke-dasharray="1 2"/>
  <text x="540" y="150" font-size="8" text-anchor="middle" font-style="italic">no oracle</text>

  <text x="540" y="182" font-size="8" text-anchor="middle" font-style="italic">the operator runs alone</text>

  <line x1="20" y1="216" x2="600" y2="216" stroke="#4a4a4a" stroke-width="0.6"/>
  <text x="20" y="234" font-size="8" font-style="italic">Figure 8. The oracle attaches for the final training epoch. VASP data searches, residuals refine.</text>
  <text x="20" y="246" font-size="8" font-style="italic"></text>
  <text x="20" y="258" font-size="8" font-style="italic"></text>
</svg>
