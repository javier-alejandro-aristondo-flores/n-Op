[project]
name = "operators"
version = "0.0.1"
description = "Neural operators over the n-Op DFT corpus, as one integral-transform framework"
requires-python = ">=3.14"
dependencies = ["numpy"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_functions = ["Test_*"]
markers = ["pool: touches the live corpus on /Pool; machine-bound"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
extraPaths = [".."]
