<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 282" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <text x="76" y="34" font-size="9" text-anchor="middle">a run on disk</text>
  <text x="76" y="58" font-size="8" text-anchor="middle" font-style="italic">OUTCAR, CONTCAR,</text>
  <text x="76" y="70" font-size="8" text-anchor="middle" font-style="italic">vasprun, WAVECAR</text>

  <!-- fingerprint -->
  <path d="M 132 60 Q 168 44 202 60" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>
  <text x="167" y="38" font-size="8" text-anchor="middle">fingerprint</text>

  <text x="286" y="42" font-size="9" text-anchor="middle">functional · AEXX · HFSCREEN · ENCUT</text>
  <text x="286" y="56" font-size="9" text-anchor="middle">POTCAR · k-mesh · ISPIN · SIGMA · ISYM</text>
  <path d="M 372 62 Q 404 74 372 86" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>
  <text x="286" y="90" font-size="10" text-anchor="middle">→ one hash</text>
  <text x="286" y="106" font-size="8" text-anchor="middle" font-style="italic">absolute energies compare only within a hash</text>

  <line x1="28" y1="128" x2="572" y2="128" stroke="#cccccc" stroke-width="0.6"/>

  <!-- the gate -->
  <text x="28" y="150" font-size="9">then the arithmetic the run must already satisfy</text>

  <text x="48" y="176" font-size="9">Σ_I f_I = 0</text>
  <text x="48" y="188" font-size="7.5" font-style="italic">translational invariance</text>

  <text x="182" y="176" font-size="9">σ_ij = σ_ji</text>
  <text x="182" y="188" font-size="7.5" font-style="italic">angular momentum</text>

  <text x="310" y="176" font-size="9">Σ_nk w_k f_nk = NELECT</text>
  <text x="310" y="188" font-size="7.5" font-style="italic">occupations count electrons</text>

  <text x="472" y="176" font-size="9">det(A) = V</text>
  <text x="472" y="188" font-size="7.5" font-style="italic">the cell is the cell</text>

  <ellipse cx="300" cy="222" rx="128" ry="18" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="300" y="226" font-size="9" text-anchor="middle">admission gate — one pass, per frame</text>

  <text x="28" y="258" font-size="8" font-style="italic">Figure 4. A DFT run is bytes, not a state. The fingerprint says what may be compared with what; the</text>
  <text x="28" y="270" font-size="8" font-style="italic">invariants test the parser and the run at once. Both are closed form and cost nothing.</text>
</svg>
