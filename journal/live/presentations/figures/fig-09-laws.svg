<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 276" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- left column -->
  <line x1="28" y1="32" x2="264" y2="32" stroke="#000000" stroke-width="0.6"/>
  <text x="28" y="46" font-size="9">structural equation of motion</text>
  <text x="28" y="60" font-size="8">∇_R E_BO = 0</text>
  <text x="28" y="72" font-size="8">stress matches the cell</text>

  <line x1="28" y1="90" x2="264" y2="90" stroke="#cccccc" stroke-width="0.6"/>
  <text x="28" y="104" font-size="9">positivity</text>
  <text x="28" y="118" font-size="8">ω² ≥ 0, on claimed-stable phases</text>
  <text x="28" y="130" font-size="8">γ̂ = γ̂†,   0 ⪯ γ̂ ⪯ 1,   Tr γ̂ = N_e</text>

  <line x1="28" y1="148" x2="264" y2="148" stroke="#cccccc" stroke-width="0.6"/>
  <text x="28" y="162" font-size="9">conservation</text>
  <text x="28" y="176" font-size="8">∂ρ/∂t + ∇·j = 0</text>
  <text x="28" y="188" font-size="8">energy</text>

  <!-- right column -->
  <line x1="296" y1="32" x2="532" y2="32" stroke="#000000" stroke-width="0.6"/>
  <text x="296" y="46" font-size="9">algebraic identities</text>
  <text x="296" y="60" font-size="8">Σ_R Φ(R) = 0    acoustic sum rule</text>
  <text x="296" y="72" font-size="8">D = μ k_B T / q    Einstein</text>

  <line x1="296" y1="90" x2="532" y2="90" stroke="#cccccc" stroke-width="0.6"/>
  <text x="296" y="104" font-size="9">thermodynamic consistency</text>
  <text x="296" y="118" font-size="8">T, P hull with a metastability band</text>
  <text x="296" y="130" font-size="8">so metastable diamond reads zero</text>

  <line x1="296" y1="148" x2="532" y2="148" stroke="#cccccc" stroke-width="0.6"/>
  <text x="296" y="162" font-size="9">symmetry</text>
  <text x="296" y="176" font-size="8">space-group equivariance</text>

  <line x1="28" y1="208" x2="532" y2="208" stroke="#cccccc" stroke-width="0.6"/>
  <text x="28" y="224" font-size="9">Scoring these needs the electronic state. Geometry alone is not enough.</text>

  <text x="28" y="252" font-size="8" font-style="italic">Figure 9. Nineteen residual categories, six of them here. Each is a named law with a literature-cited</text>
  <text x="28" y="264" font-size="8" font-style="italic">rule behind it, scored separately and never summed together.</text>
</svg>
