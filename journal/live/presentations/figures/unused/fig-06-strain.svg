<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 286" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- reference and deformed cells -->
  <path d="M 60 118 L 128 118 L 156 76 L 88 76 Z" fill="none" stroke="#999999" stroke-width="0.6"/>
  <text x="106" y="136" font-size="8" text-anchor="middle" font-style="italic">A_ref</text>

  <path d="M 214 122 L 290 122 L 330 70 L 254 70 Z" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="270" y="140" font-size="8" text-anchor="middle" font-style="italic">A_def</text>

  <path d="M 164 96 Q 190 82 208 94" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="410" y="86" font-size="11" text-anchor="middle">M = A_ref⁻¹ A_def</text>
  <text x="410" y="106" font-size="11" text-anchor="middle">F = Mᵀ</text>
  <text x="410" y="126" font-size="11" text-anchor="middle">E_GL = ½ (FᵀF − I)</text>

  <line x1="28" y1="160" x2="552" y2="160" stroke="#cccccc" stroke-width="0.6"/>

  <text x="28" y="180" font-size="9">Lattices are stored by row. Every transpose is a chance to be wrong and still look plausible.</text>
  <text x="28" y="200" font-size="9">Transpose-free, using the metric G = A Aᵀ:</text>
  <text x="290" y="224" font-size="12" text-anchor="middle">E_GL = ½ ( A_ref⁻¹ G_def A_ref⁻ᵀ − I )</text>

  <text x="28" y="252" font-size="8" font-style="italic">Figure 6. Filling h. Strain is not stored anywhere — it is a derived quantity, and the derivation is exact.</text>
  <text x="28" y="264" font-size="8" font-style="italic">Achieved strain read back from the relaxed cell, against the strain that was asked for, is a free data-quality</text>
  <text x="28" y="276" font-size="8" font-style="italic">check on the same two matrices.</text>
</svg>
