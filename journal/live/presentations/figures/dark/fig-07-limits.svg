<svg fill="#e6e6e6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 258" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="-9999" y="-9999" width="99999" height="99999" fill="#1c1c1c"/>

  <!-- left: extrapolation, no error bars -->
  <text x="40" y="30" font-size="9">off the training distribution</text>

  <rect x="40" y="46" width="140" height="112" fill="#303030"/>
  <text x="110" y="172" font-size="8" text-anchor="middle" font-style="italic">where the data was</text>

  <path d="M 40 130 Q 88 96 132 106 Q 176 116 220 88 Q 250 68 270 54"
        fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <path d="M 40 130 Q 88 96 132 106 Q 176 118 220 112 Q 252 108 272 118"
        fill="none" stroke="#e6e6e6" stroke-width="1.6"/>

  <text x="286" y="58" font-size="8" font-style="italic">true</text>
  <text x="286" y="122" font-size="8" font-style="italic">predicted</text>

  <text x="40" y="196" font-size="8" font-style="italic">It keeps answering, in range, with the same confidence.</text>
  <text x="40" y="208" font-size="8" font-style="italic">Nothing in the output says which side of the edge you are on.</text>

  <line x1="330" y1="20" x2="330" y2="216" stroke="#4a4a4a" stroke-width="0.6"/>

  <!-- right: spectral bias -->
  <text x="360" y="30" font-size="9">sharp features</text>

  <path d="M 360 140 L 424 140 L 424 72 L 448 72 L 448 138 L 520 138"
        fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <path d="M 360 140 Q 404 138 424 112 Q 436 96 448 112 Q 468 138 520 138"
        fill="none" stroke="#e6e6e6" stroke-width="1.6"/>

  <text x="440" y="172" font-size="8" text-anchor="middle" font-style="italic">a band edge, or a defect level</text>

  <text x="360" y="196" font-size="8" font-style="italic">Smooth modes are learned first and sharp ones last.</text>
  <text x="360" y="208" font-size="8" font-style="italic">The rounding is exactly where the device physics lives.</text>

  <line x1="26" y1="228" x2="534" y2="228" stroke="#4a4a4a" stroke-width="0.6"/>
  <text x="26" y="246" font-size="8" font-style="italic">Figure 7. Both failures are quiet. A learned model returns a plausible number either way, which is the argument for scoring its output against something that is not learned.</text>
</svg>
