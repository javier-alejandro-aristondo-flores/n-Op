<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 234" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- the tower, each storey built from the one below -->
  <text x="104" y="46" font-size="9" text-anchor="middle">⋯</text>
  <line x1="104" y1="56" x2="104" y2="76" stroke="#000000" stroke-width="0.6" stroke-dasharray="4 2" marker-end="url(#a)"/>

  <text x="104" y="90" font-size="10" text-anchor="middle">Σ</text>
  <text x="113" y="94" font-size="7">2</text>
  <text x="113" y="85" font-size="7">p</text>
  <line x1="104" y1="100" x2="104" y2="122" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>
  <text x="118" y="115" font-size="8" font-style="italic">+ an oracle</text>

  <text x="104" y="136" font-size="10" text-anchor="middle">P</text>
  <text x="114" y="130" font-size="7">NP</text>
  <line x1="104" y1="146" x2="104" y2="168" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>
  <text x="118" y="161" font-size="8" font-style="italic">+ an oracle</text>

  <text x="104" y="182" font-size="10" text-anchor="middle">P</text>

  <text x="104" y="206" font-size="8" text-anchor="middle" font-style="italic">the polynomial hierarchy</text>
  <text x="104" y="218" font-size="8" text-anchor="middle" font-style="italic">BGS '75 — oracles cut both ways</text>

  <line x1="250" y1="20" x2="250" y2="210" stroke="#cccccc" stroke-width="0.6"/>

  <!-- what comes back -->
  <text x="342" y="48" font-size="8" text-anchor="middle" font-style="italic">textbook oracle</text>
  <text x="342" y="74" font-size="15" text-anchor="middle">0 / 1</text>
  <text x="342" y="90" font-size="8" text-anchor="middle" font-style="italic">no direction for a learner</text>

  <line x1="268" y1="106" x2="418" y2="106" stroke="#cccccc" stroke-width="0.6"/>

  <text x="342" y="126" font-size="8" text-anchor="middle" font-style="italic">ours</text>
  <rect x="290" y="136" width="26" height="16" fill="#eeeeee" stroke="#000000" stroke-width="0.6"/>
  <rect x="316" y="136" width="26" height="16" fill="#ffffff" stroke="#000000" stroke-width="0.6"/>
  <rect x="342" y="136" width="26" height="16" fill="#eeeeee" stroke="#000000" stroke-width="0.6"/>
  <rect x="368" y="136" width="26" height="16" fill="#ffffff" stroke="#000000" stroke-width="0.6"/>
  <path d="M 342 158 Q 354 168 342 178" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="364" y="174" font-size="11">∇</text>
  <text x="342" y="196" font-size="8" text-anchor="middle" font-style="italic">one value per law, and a direction</text>

  <text x="20" y="228" font-size="8" font-style="italic">Figure 4. Each storey is the one below, handed an oracle.</text>
</svg>
