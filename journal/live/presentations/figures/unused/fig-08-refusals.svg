<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 258" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <circle cx="40" cy="42" r="9" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="1 2"/>
  <text x="62" y="40" font-size="9">hole transport in β-Ga₂O₃</text>
  <text x="62" y="53" font-size="8" font-style="italic">flat valence bands, small-polaron self-trapping. There is no band-like p-transport to model.</text>

  <circle cx="40" cy="86" r="9" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="1 2"/>
  <text x="62" y="84" font-size="9">measured impact ionisation in AlN</text>
  <text x="62" y="97" font-size="8" font-style="italic">Monte-Carlo only, electron-only. Declared a gap rather than seeded from theory.</text>

  <circle cx="40" cy="130" r="9" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="1 2"/>
  <text x="62" y="128" font-size="9">breakdown above ~500 °C</text>
  <text x="62" y="141" font-size="8" font-style="italic">the hot-carrier tail anchors do not exist. This is the headline operating point, and it is refused.</text>

  <circle cx="40" cy="174" r="9" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="1 2"/>
  <text x="62" y="172" font-size="9">quasi-harmonic approximation above ~Θ_D / 2</text>
  <text x="62" y="185" font-size="8" font-style="italic">GaN fails at exactly 500 °C. "QHA suffices" is a diamond-only claim.</text>

  <circle cx="40" cy="218" r="9" fill="none" stroke="#000000" stroke-width="1.6" stroke-dasharray="1 2"/>
  <text x="62" y="216" font-size="9">strongly correlated systems</text>
  <text x="62" y="229" font-size="8" font-style="italic">γ̂ is mean-field by construction. Mott insulators and spin liquids are outside it.</text>

  <text x="28" y="252" font-size="8" font-style="italic">Figure 8. Each refusal has a physical reason and is recorded as machine data, not left as silence.</text>
</svg>
