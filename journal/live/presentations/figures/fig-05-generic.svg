<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 268" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <text x="280" y="42" font-size="15" text-anchor="middle">dx/dt  =  L · δE/δx  +  M · δS/δx</text>

  <text x="176" y="62" font-size="8" text-anchor="middle" font-style="italic">reversible</text>
  <text x="392" y="62" font-size="8" text-anchor="middle" font-style="italic">dissipative</text>

  <text x="280" y="86" font-size="8" text-anchor="middle" font-style="italic">x is the seven-slot state. L is antisymmetric and conserves energy; M is positive-semidefinite and produces entropy.</text>

  <line x1="28" y1="106" x2="532" y2="106" stroke="#cccccc" stroke-width="0.6"/>

  <text x="280" y="128" font-size="9" text-anchor="middle">every property regime is an extraction of it</text>

  <!-- curved morphisms out to the regimes -->
  <path d="M 244 138 Q 172 152 108 168" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>
  <path d="M 264 140 Q 234 158 216 174" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>
  <path d="M 296 140 Q 326 158 344 174" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>
  <path d="M 316 138 Q 388 152 452 168" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#a)"/>

  <text x="98" y="184" font-size="9" text-anchor="middle">elastic</text>
  <text x="98" y="196" font-size="7.5" text-anchor="middle" font-style="italic">L only, ions and cell</text>

  <text x="222" y="190" font-size="9" text-anchor="middle">phonons</text>
  <text x="222" y="202" font-size="7.5" text-anchor="middle" font-style="italic">L linearised at a minimum</text>

  <text x="352" y="190" font-size="9" text-anchor="middle">transport</text>
  <text x="352" y="202" font-size="7.5" text-anchor="middle" font-style="italic">M dominates</text>

  <text x="462" y="184" font-size="9" text-anchor="middle">optical</text>
  <text x="462" y="196" font-size="7.5" text-anchor="middle" font-style="italic">γ̂ driven by A</text>

  <line x1="28" y1="220" x2="532" y2="220" stroke="#cccccc" stroke-width="0.6"/>
  <text x="28" y="238" font-size="9">The momenta are in the state because the law needs them. Drop P_I and Π_h and there is no L.</text>

  <text x="28" y="262" font-size="8" font-style="italic">Figure 5. The slots are not a wish list. They are exactly what a metriplectic law is written over.</text>
</svg>
