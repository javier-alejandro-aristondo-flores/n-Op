<svg fill="#e6e6e6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 268" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="-9999" y="-9999" width="99999" height="99999" fill="#1c1c1c"/>

  <text x="26" y="28" font-size="9">one channel — a function over an axis, not a vector of samples</text>

  <path d="M 40 118 Q 100 70 160 110 Q 220 150 280 94 Q 340 58 460 90"
        fill="none" stroke="#e6e6e6" stroke-width="1"/>

  <line x1="34" y1="168" x2="470" y2="168" stroke="#e6e6e6" stroke-width="0.6"/>

  <!-- the grid it was trained on -->
  <circle cx="60"  cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <circle cx="110" cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <circle cx="160" cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <circle cx="210" cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <circle cx="260" cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <circle cx="310" cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <circle cx="360" cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <circle cx="410" cy="168" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>

  <!-- where residuals actually get evaluated -->
  <line x1="84"  y1="168" x2="84"  y2="90"  stroke="#e6e6e6" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="137" y1="168" x2="137" y2="96"  stroke="#e6e6e6" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="232" y1="168" x2="232" y2="120" stroke="#e6e6e6" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="288" y1="168" x2="288" y2="91"  stroke="#e6e6e6" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="381" y1="168" x2="381" y2="71"  stroke="#e6e6e6" stroke-width="0.6" stroke-dasharray="4 2"/>

  <circle cx="84"  cy="90"  r="3.4" fill="#e6e6e6"/>
  <circle cx="137" cy="96"  r="3.4" fill="#e6e6e6"/>
  <circle cx="232" cy="120" r="3.4" fill="#e6e6e6"/>
  <circle cx="288" cy="91"  r="3.4" fill="#e6e6e6"/>
  <circle cx="381" cy="71"  r="3.4" fill="#e6e6e6"/>

  <!-- a second, unrelated discretisation of the same axis -->
  <line x1="34" y1="196" x2="470" y2="196" stroke="#4a4a4a" stroke-width="0.6"/>
  <g stroke="#8a8a8a" stroke-width="0.6">
    <line x1="48"  y1="192" x2="48"  y2="200"/><line x1="76"  y1="192" x2="76"  y2="200"/>
    <line x1="104" y1="192" x2="104" y2="200"/><line x1="132" y1="192" x2="132" y2="200"/>
    <line x1="160" y1="192" x2="160" y2="200"/><line x1="188" y1="192" x2="188" y2="200"/>
    <line x1="216" y1="192" x2="216" y2="200"/><line x1="244" y1="192" x2="244" y2="200"/>
    <line x1="272" y1="192" x2="272" y2="200"/><line x1="300" y1="192" x2="300" y2="200"/>
    <line x1="328" y1="192" x2="328" y2="200"/><line x1="356" y1="192" x2="356" y2="200"/>
    <line x1="384" y1="192" x2="384" y2="200"/><line x1="412" y1="192" x2="412" y2="200"/>
    <line x1="440" y1="192" x2="440" y2="200"/>
  </g>
  <text x="34" y="214" font-size="8" font-style="italic">a different mesh — same weights, no retraining</text>

  <line x1="26" y1="230" x2="494" y2="230" stroke="#4a4a4a" stroke-width="0.6"/>

  <circle cx="34" cy="243" r="3" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
  <text x="44" y="246" font-size="8" font-style="italic">the grid it was trained on</text>
  <circle cx="212" cy="243" r="3.4" fill="#e6e6e6"/>
  <text x="222" y="246" font-size="8" font-style="italic">where the oracle asks</text>

  <text x="26" y="264" font-size="8" font-style="italic">Figure 3. Residuals are evaluated at axis points that sit nowhere on the training grid, and supercells and k-meshes vary across the problem.</text>
</svg>
