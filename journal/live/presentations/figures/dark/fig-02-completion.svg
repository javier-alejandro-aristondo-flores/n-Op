<svg fill="#e6e6e6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e6e6e6"/>
    </marker>
  </defs>
  <rect x="-9999" y="-9999" width="99999" height="99999" fill="#1c1c1c"/>

  <!-- ===== channels you hand it ===== -->
  <text x="30" y="34" font-size="8" font-style="italic">input</text>

  <text x="30" y="40" font-size="7.5" font-style="italic">lattice a</text>
  <line x1="30" y1="76" x2="118" y2="76" stroke="#4a4a4a" stroke-width="0.6"/>
  <path d="M 30 60 L 118 60" fill="none" stroke="#5b8fc7" stroke-width="1.6"/>

  <text x="30" y="88" font-size="7.5" font-style="italic">σ(T)</text>
  <line x1="30" y1="124" x2="118" y2="124" stroke="#4a4a4a" stroke-width="0.6"/>
  <path d="M 30 122 Q 74 118 118 98" fill="none" stroke="#f2963d" stroke-width="1.6"/>

  <text x="30" y="136" font-size="7.5" font-style="italic">phonon DOS</text>
  <line x1="30" y1="172" x2="118" y2="172" stroke="#4a4a4a" stroke-width="0.6"/>
  <path d="M 30 170 L 42 152 L 52 166 L 64 144 L 76 164 L 88 150 L 100 166 L 118 170"
        fill="none" stroke="#6bb562" stroke-width="1.6"/>

  <text x="30" y="184" font-size="7.5" font-style="italic">ε(ω)</text>
  <line x1="30" y1="220" x2="118" y2="220" stroke="#4a4a4a" stroke-width="0.6"/>
  <path d="M 30 216 L 48 214 L 56 192 L 64 210 Q 90 218 118 219" fill="none" stroke="#bd8ac4" stroke-width="1.6"/>

  <text x="30" y="232" font-size="7.5" font-style="italic">κ(T)</text>
  <rect x="30" y="238" width="88" height="32" fill="none" stroke="#e8676a" stroke-width="1.6" stroke-dasharray="1 2"/>
  <text x="74" y="260" font-size="12" text-anchor="middle" fill="#e8676a">?</text>
  <text x="124" y="258" font-size="7.5" font-style="italic">not supplied</text>

  <!-- brace -->
  <path d="M 200 44 Q 208 44 208 52 L 208 148 Q 208 156 216 156 Q 208 156 208 164 L 208 262 Q 208 270 200 270"
        fill="none" stroke="#e6e6e6" stroke-width="1"/>

  <path d="M 222 156 Q 254 140 288 152" fill="none" stroke="#e6e6e6" stroke-width="1" marker-end="url(#a)"/>

  <!-- ===== the operator ===== -->
  <ellipse cx="352" cy="156" rx="62" ry="30" fill="#303030" stroke="#e6e6e6" stroke-width="1"/>
  <text x="352" y="153" font-size="10" text-anchor="middle">neural operator</text>
  <text x="352" y="167" font-size="7.5" text-anchor="middle" font-style="italic">completes the state</text>

  <path d="M 416 156 Q 446 140 476 150" fill="none" stroke="#e6e6e6" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ===== channels it returns ===== -->
  <text x="490" y="34" font-size="8" font-style="italic">output</text>

  <text x="490" y="96" font-size="7.5" font-style="italic">κ(T)</text>
  <line x1="490" y1="134" x2="578" y2="134" stroke="#4a4a4a" stroke-width="0.6"/>
  <path d="M 490 132 Q 534 128 578 108" fill="none" stroke="#e8676a" stroke-width="1.6"/>

  <text x="490" y="176" font-size="7.5" font-style="italic">E_g(T)</text>
  <line x1="490" y1="214" x2="578" y2="214" stroke="#4a4a4a" stroke-width="0.6"/>
  <path d="M 490 186 Q 534 196 578 206" fill="none" stroke="#4fa8a0" stroke-width="1.6"/>


  <line x1="24" y1="290" x2="596" y2="290" stroke="#4a4a4a" stroke-width="0.6"/>
  <text x="24" y="308" font-size="8" font-style="italic">Figure 2. Hand it a topology and the properties you have. Some are constant, some vary.</text>
  <text x="24" y="320" font-size="8" font-style="italic">It returns the ones you did not supply. Without the topology, many structures fit the same properties.</text>
</svg>
