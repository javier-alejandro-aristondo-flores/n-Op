<svg fill="#e6e6e6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 288" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e6e6e6"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="-9999" y="-9999" width="99999" height="99999" fill="#1c1c1c"/>

  <text x="290" y="34" font-size="12" text-anchor="middle">( value ,  σ ,  provenance ,  coverage )</text>
  <text x="290" y="50" font-size="8" text-anchor="middle" font-style="italic">a bridge record. A value without an uncertainty is not accepted.</text>

  <line x1="28" y1="70" x2="552" y2="70" stroke="#4a4a4a" stroke-width="0.6"/>

  <!-- route 1 : redundancy -->
  <text x="150" y="92" font-size="9" text-anchor="middle">compute the same shape more than once</text>

  <circle cx="106" cy="122" r="2.4" fill="#e6e6e6"/>
  <circle cx="146" cy="118" r="2.4" fill="#e6e6e6"/>
  <circle cx="186" cy="126" r="2.4" fill="#e6e6e6"/>
  <line x1="92" y1="140" x2="200" y2="140" stroke="#8a8a8a" stroke-width="0.6"/>
  <path d="M 106 150 Q 146 164 186 150" fill="none" stroke="#e6e6e6" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="150" y="180" font-size="9" text-anchor="middle">the spread is the noise floor</text>

  <line x1="290" y1="80" x2="290" y2="200" stroke="#4a4a4a" stroke-width="0.6"/>

  <!-- route 2 : symmetry nulls -->
  <text x="424" y="92" font-size="9" text-anchor="middle">read the components that must vanish</text>

  <text x="424" y="124" font-size="10" text-anchor="middle">C₁₄ = C₁₅ = C₁₆ = … = 0</text>
  <text x="424" y="142" font-size="8" text-anchor="middle" font-style="italic">cubic symmetry says so; the run was never told</text>
  <path d="M 380 154 Q 424 168 468 154" fill="none" stroke="#e6e6e6" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="424" y="180" font-size="9" text-anchor="middle">whatever is left is numerical error</text>

  <line x1="28" y1="210" x2="552" y2="210" stroke="#4a4a4a" stroke-width="0.6"/>

  <text x="28" y="230" font-size="9">This is precision, not accuracy. Basis set, pseudopotential and functional bias cancel exactly here.</text>
  <text x="28" y="246" font-size="9">Systematic error has to come from somewhere else, and the record says which is which.</text>

  <text x="28" y="274" font-size="8" font-style="italic">Figure 6. Two ways to get an error bar out of data already computed. Derived quantities inherit one by</text>
  <text x="28" y="286" font-size="8" font-style="italic">propagation, so a coefficient cannot be quoted with less uncertainty than its inputs.</text>
</svg>
