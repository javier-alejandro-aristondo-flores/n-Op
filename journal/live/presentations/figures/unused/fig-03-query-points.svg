<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 226" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <text x="26" y="30" font-size="8" font-style="italic">a functional channel</text>

  <path d="M 40 120 Q 100 72 160 112 Q 220 152 280 96 Q 340 60 440 92"
        fill="none" stroke="#000000" stroke-width="1"/>

  <line x1="34" y1="170" x2="446" y2="170" stroke="#000000" stroke-width="0.6"/>

  <!-- the grid it was trained on -->
  <circle cx="60"  cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <circle cx="110" cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <circle cx="160" cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <circle cx="210" cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <circle cx="260" cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <circle cx="310" cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <circle cx="360" cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <circle cx="410" cy="170" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>

  <!-- where residuals actually get evaluated -->
  <line x1="84"  y1="170" x2="84"  y2="92"  stroke="#000000" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="137" y1="170" x2="137" y2="98"  stroke="#000000" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="232" y1="170" x2="232" y2="122" stroke="#000000" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="288" y1="170" x2="288" y2="93"  stroke="#000000" stroke-width="0.6" stroke-dasharray="4 2"/>
  <line x1="381" y1="170" x2="381" y2="73"  stroke="#000000" stroke-width="0.6" stroke-dasharray="4 2"/>

  <circle cx="84"  cy="92"  r="3" fill="#000000"/>
  <circle cx="137" cy="98"  r="3" fill="#000000"/>
  <circle cx="232" cy="122" r="3" fill="#000000"/>
  <circle cx="288" cy="93"  r="3" fill="#000000"/>
  <circle cx="381" cy="73"  r="3" fill="#000000"/>

  <circle cx="60" cy="192" r="3" fill="none" stroke="#999999" stroke-width="0.6"/>
  <text x="70" y="195" font-size="8" font-style="italic">training grid</text>

  <circle cx="248" cy="192" r="3" fill="#000000"/>
  <text x="258" y="195" font-size="8" font-style="italic">where the oracle asks</text>

  <text x="26" y="220" font-size="8" font-style="italic">Figure 3. Residuals are evaluated at axis points that sit nowhere on the training grid. A mesh-bound model cannot answer there.</text>
</svg>
