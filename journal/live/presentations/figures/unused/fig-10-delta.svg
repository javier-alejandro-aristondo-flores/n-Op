<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 288" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <text x="290" y="32" font-size="9" text-anchor="middle">two theory levels evaluated at the same geometries. Δ(x) = E_HSE(x) − E_PBE(x).</text>
  <text x="290" y="48" font-size="9" text-anchor="middle">Not "what is the correction". Is it constant?</text>

  <!-- flat case -->
  <line x1="60" y1="192" x2="240" y2="192" stroke="#999999" stroke-width="0.6"/>
  <line x1="60" y1="192" x2="60" y2="86" stroke="#999999" stroke-width="0.6"/>
  <path d="M 68 128 L 232 126" fill="none" stroke="#000000" stroke-width="1.6"/>
  <circle cx="90" cy="127" r="1.8" fill="#000000"/>
  <circle cx="132" cy="129" r="1.8" fill="#000000"/>
  <circle cx="176" cy="126" r="1.8" fill="#000000"/>
  <circle cx="214" cy="127" r="1.8" fill="#000000"/>
  <text x="150" y="210" font-size="9" text-anchor="middle">flat</text>
  <text x="150" y="224" font-size="8" text-anchor="middle" font-style="italic">cheap DFT plus one offset is defensible</text>
  <text x="150" y="238" font-size="8" text-anchor="middle" font-style="italic">the operator learns on the cheap level</text>

  <line x1="290" y1="70" x2="290" y2="242" stroke="#cccccc" stroke-width="0.6"/>

  <!-- varying case -->
  <line x1="340" y1="192" x2="520" y2="192" stroke="#999999" stroke-width="0.6"/>
  <line x1="340" y1="192" x2="340" y2="86" stroke="#999999" stroke-width="0.6"/>
  <path d="M 348 156 Q 420 88 512 148" fill="none" stroke="#000000" stroke-width="1.6"/>
  <circle cx="370" cy="139" r="1.8" fill="#000000"/>
  <circle cx="412" cy="114" r="1.8" fill="#000000"/>
  <circle cx="456" cy="112" r="1.8" fill="#000000"/>
  <circle cx="494" cy="134" r="1.8" fill="#000000"/>
  <text x="430" y="210" font-size="9" text-anchor="middle">varying</text>
  <text x="430" y="224" font-size="8" text-anchor="middle" font-style="italic">it is not — and the variation is the physics</text>
  <text x="430" y="238" font-size="8" text-anchor="middle" font-style="italic">the operator has to carry the level itself</text>

  <text x="60" y="82" font-size="8" font-style="italic">Δ</text>
  <text x="248" y="196" font-size="8" font-style="italic">strain</text>
  <text x="340" y="82" font-size="8" font-style="italic">Δ</text>
  <text x="528" y="196" font-size="8" font-style="italic">strain</text>

  <text x="28" y="266" font-size="8" font-style="italic">Figure 10. A question the data answers either way, and the answer changes the architecture. Run it separately</text>
  <text x="28" y="278" font-size="8" font-style="italic">for energy, for stress and for the gap — they need not behave alike.</text>
</svg>
