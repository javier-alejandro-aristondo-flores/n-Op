name = "codomain_attention"
literature_name = "CoDA-NO (Codomain Attention Neural Operator)"
citation = "Rahman et al. — NeurIPS 2024 (arXiv:2403.12553)"
mapping = "any subset of the fields → the missing fields"
suite_card = "test-suite.md §6, V.1 — IN-LOCAL"
role = "the multi-field completion experiment; strongest transfer headline (alloy held out; few-shot fine-tunes)"

[parts]
encoder = "encoders.VariableEncoding (per-field learned encodings; functional covariate in the encoding slot)"
kernel = "kernels.codomain_attention.CodomainAttentionKernel over kernels.spectral.SpectralKernel (token-shared weights)"
composition = "compositions.ExplicitStack"
readout = "codomain_attention.readout.TokenSharedReadout (member-local; readouts.PointwiseProjection is not token-count invariant)"
wrappers = "per-token heads realized member-side (codomain_attention.readout.Per_Token_Heads), reusing wrappers.Channel_Means and wrappers.Renormalization_Scale"

[depends_on]
framework = true
kernels = ["codomain_attention", "spectral"]
packages = []
shared_note = "competitor for every kill gate: the dedicated per-pair factorized_fourier operator, trained on the same cubic block at equal total compute; its measured numbers are cited in report.py, not imported in code"
