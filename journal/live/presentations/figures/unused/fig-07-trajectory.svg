<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 288" font-family="Charter, Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#999999" stroke-width="0.6"/>
    </pattern>
  </defs>

  <text x="28" y="32" font-size="9">the ionic relaxation, with the cell held fixed</text>

  <!-- step ticks along a path -->
  <path d="M 60 96 Q 200 52 400 88" fill="none" stroke="#cccccc" stroke-width="0.6"/>
  <circle cx="60" cy="96" r="3.2" fill="#000000"/>
  <circle cx="124" cy="74" r="2" fill="#999999"/>
  <circle cx="196" cy="62" r="2" fill="#999999"/>
  <circle cx="268" cy="62" r="2" fill="#999999"/>
  <circle cx="336" cy="72" r="2" fill="#999999"/>
  <circle cx="400" cy="88" r="3.2" fill="#000000"/>

  <text x="60" y="118" font-size="9" text-anchor="middle">step 1</text>
  <text x="60" y="130" font-size="7.5" text-anchor="middle" font-style="italic">ions still on the affine map</text>
  <text x="60" y="142" font-size="8" text-anchor="middle">clamped</text>

  <text x="400" y="118" font-size="9" text-anchor="middle">converged</text>
  <text x="400" y="130" font-size="7.5" text-anchor="middle" font-style="italic">ions found their own places</text>
  <text x="400" y="142" font-size="8" text-anchor="middle">relaxed</text>

  <path d="M 96 160 Q 230 186 364 160" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="230" y="200" font-size="9" text-anchor="middle">the difference is the internal strain — Kleinman ζ</text>

  <line x1="28" y1="220" x2="552" y2="220" stroke="#cccccc" stroke-width="0.6"/>

  <text x="28" y="240" font-size="9">u = (r₂ − r₁)_relaxed − (r₂ − r₁)_ideal        the sublattice slid; the cell did not</text>

  <text x="28" y="266" font-size="8" font-style="italic">Figure 7. Filling R_I. A relaxation trajectory is data, not a log — every intermediate step is a legitimate</text>
  <text x="28" y="278" font-size="8" font-style="italic">off-equilibrium sample. The reading is only valid if step 1 really was unrelaxed, so that gets checked per run.</text>
</svg>
